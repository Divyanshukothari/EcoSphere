version: '3.9'

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ecosphere_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecosphere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecosphere"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ── DB Migration (runs migrate.sql then seeds admin, then exits) ────────
  migrate:
    image: postgres:15-alpine
    container_name: ecosphere_migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrate.sql:/migrate.sql:ro
    environment:
      PGPASSWORD: postgres
    entrypoint: >
      sh -c "
        echo '── Running migrations ──' &&
        psql -h postgres -U postgres -d ecosphere -f /migrate.sql &&
        echo '── Migrations complete ──'
      "
    restart: "no"

  # ── Express Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecosphere_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ecosphere
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_for_ecosphere_change_in_prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DAILY_MESSAGE_LIMIT: ${DAILY_MESSAGE_LIMIT:-10}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── React Frontend (Vite dev server) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecosphere_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
